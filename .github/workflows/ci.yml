name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: ccx end-to-end tests
        run: tests/ccx_test.sh
      - name: Swift tests
        run: swift test
      - name: Build universal app
        run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Switcher
          path: dist/*.zip
