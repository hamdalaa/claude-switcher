name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "App version (Settings menu), macOS version, `claude --version`, your shell and terminal"
      placeholder: "1.1.0 · macOS 15.4 · Claude Code 2.1 · zsh · Ghostty"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "`log show --last 10m --predicate 'subsystem == \"io.github.hamdalaa.ClaudeSwitcher\"'` and `ccx status`. Remove anything personal. Never paste tokens."
      render: text
